[project]
name = "percona-dk"
version = "0.2.0"
description = "Percona Developer Knowledge — semantic search and retrieval of Percona documentation for AI assistants and developer tools"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = ["percona", "documentation", "mcp", "semantic-search", "chromadb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Documentation",
    "Topic :: Database",
]
# Upper bounds block the next major only; the deployment pins exact versions in
# constraints.txt instead, so self-hosted copies stay free to resolve their own.
# fastmcp's floor is 3.2.4 because the HTTP transports import
# fastmcp.server.middleware.rate_limiting and fastmcp.server.dependencies.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "chromadb>=1.0,<2",
    "fastmcp>=3.2.4,<4",
    "gitpython>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
]

[project.scripts]
percona-dk-ingest = "percona_dk.ingest:main"
percona-dk-server = "percona_dk.server:main"
percona-dk-mcp = "percona_dk.mcp_server:main"
percona-dk-mcp-remote = "percona_dk.mcp_remote_shim:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
